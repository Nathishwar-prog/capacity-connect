$kind: http-request
url: "{{baseUrl}}/courses"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "title": "Radar Meteorology & Weather Analysis",
      "description": "Comprehensive course covering Doppler radar data processing and storm tracking.",
      "category": "Atmospheric Sciences",
      "difficulty": "INTERMEDIATE",
      "durationMinutes": 180,
      "id": "clx12345",
      "status": "DRAFT"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/Create a new course (Trainer).resources/examples
order: 2000
