$kind: http-example
request:
  url: "{{baseUrl}}/courses"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "title": "Radar Meteorology & Weather Analysis",
        "description": "Comprehensive course covering Doppler radar data processing and storm tracking.",
        "category": "Atmospheric Sciences",
        "difficulty": "INTERMEDIATE",
        "durationMinutes": 180,
        "id": "clx12345",
        "status": "DRAFT"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "title": "Radar Meteorology & Weather Analysis",
        "description": "Comprehensive course covering Doppler radar data processing and storm tracking.",
        "category": "Atmospheric Sciences",
        "difficulty": "INTERMEDIATE",
        "durationMinutes": 180,
        "id": "clx12345",
        "status": "DRAFT"
      }
order: 1000
