$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "string",
      "password": "string"
    }
examples: ./.resources/Login to obtain JWT token.resources/examples
order: 1000
