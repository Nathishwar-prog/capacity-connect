$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "string",
        "password": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "string",
        "data": {
          "accessToken": "string",
          "user": {
            "id": "string",
            "email": "string",
            "role": "string"
          }
        }
      }
order: 1000
