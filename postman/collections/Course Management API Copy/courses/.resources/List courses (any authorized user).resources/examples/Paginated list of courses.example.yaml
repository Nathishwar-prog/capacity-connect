$kind: http-example
request:
  url: "{{baseUrl}}/courses?take=10&skip=0"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    take: "10"
    skip: "0"
